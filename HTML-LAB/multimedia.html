<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Multimedia</title>
</head>
<body>
    <h1>HTML Multimedia</h1>

    <h2>1. Image</h2>
    <img src="images/hobby.jpg"
        alt="My Hobby"
        width="300">
    <hr>
    <h2>2. Audio</h2>

    <audio controls>
        <source src="media/audio.mp3" type="audio/mpeg">

    </audio>

    <hr>

    <h2>3. Video</h2>
    <video width="400" controls>
        <source src="media/video.mp4" type="video/mp4">
    </video>

    <hr>

    <h2>4. Embedded Educational Video</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube-nocookie.com/embed/UB1O30fR-EE"
        title="HTML Educationa Video"
        allowfullscreen>
    </iframe>
</body>
</html>
