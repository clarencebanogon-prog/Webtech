
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>
    <p>Please fill out the form below to register.</p>

    <form action="#" method="post">

        <!-- Full Name -->
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname"
               placeholder="Enter your full name"
               minlength="2" maxlength="100" required>
        <br><br>

        <!-- Student ID -->
        <label for="studentid">Student ID:</label>
        <input type="text" id="studentid" name="studentid"
               placeholder="Enter your student ID"
               maxlength="20" required>
        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email address" required>
        <br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
               placeholder="Enter your password"
               minlength="8" maxlength="30" required>
        <br><br>

        <!-- Birthday -->
        <label for="birthday">Birthday:</label>
        <input type="date" id="birthday" name="birthday" required>
        <br><br>

        <!-- Gender -->
        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="prefer" name="gender" value="Prefer not to say">
        <label for="prefer">Prefer not to say</label>
        <br><br>

        <!-- Program -->
        <label for="program">Program:</label>
        <select id="program" name="program" required>
            <option value="">-- Select your program --</option>
            <option value="BSIT">BS Information Technology</option>
            <option value="BSCS">BS Computer Science</option>
            <option value="BSIS">BS Information Systems</option>
            <option value="BSEMC">BS Entertainment and Multimedia Computing</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        <!-- Hobbies -->
        <p>Hobbies:</p>
        <input type="checkbox" id="reading" name="hobbies" value="Reading">
        <label for="reading">Reading</label>

        <input type="checkbox" id="gaming" name="hobbies" value="Gaming">
        <label for="gaming">Gaming</label>

        <input type="checkbox" id="sports" name="hobbies" value="Sports">
        <label for="sports">Sports</label>

        <input type="checkbox" id="music" name="hobbies" value="Music">
        <label for="music">Listening to Music</label>
        <br><br>

        <!-- Address -->
        <label for="address">Address:</label>
        <br>
        <textarea id="address" name="address" rows="3" cols="40"
                  placeholder="Enter your complete address"
                  minlength="5" maxlength="200" required></textarea>
        <br><br>

        <!-- Comments -->
        <label for="comments">Comments:</label>
        <br>
        <textarea id="comments" name="comments" rows="4" cols="40"
                  placeholder="Enter your comments (optional)"
                  maxlength="500"></textarea>
        <br><br>

        <!-- Buttons -->
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
